name: Backend CI

on:
    push:
        branches: [dev, integration, main]
    pull_request:
        branches: [dev, integration, main]

permissions:
    contents: read

concurrency:
    group: backend-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    branch-flow:
        name: Backend CI / branch-flow
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Enforce promotion source branch
              env:
                  BASE_BRANCH: ${{ github.base_ref }}
                  HEAD_BRANCH: ${{ github.head_ref }}
              run: |
                  case "$BASE_BRANCH" in
                    integration)
                      [[ "$HEAD_BRANCH" == "dev" ]] || { echo "integration accepts PRs only from dev"; exit 1; }
                      ;;
                    main)
                      [[ "$HEAD_BRANCH" == "integration" ]] || { echo "main accepts PRs only from integration"; exit 1; }
                      ;;
                    dev)
                      case "$HEAD_BRANCH" in
                        dev|integration|main) echo "Use a topic branch for PRs into dev"; exit 1 ;;
                      esac
                      ;;
                  esac

    verify:
        name: Backend CI / verify
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: stack_playground_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d stack_playground_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/stack_playground_test
            TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stack_playground_test
            RUN_DB_TESTS: 'true'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            - name: Check formatting
              run: npm run format:check
            - name: Lint backend
              run: npm run lint
            - name: Apply migrations twice to verify repeatability
              run: |
                  npm run db:migrate
                  npm run db:migrate
            - name: Run unit, API, and PostgreSQL integration tests
              run: npm test
            - name: Build backend
              run: npm run build
